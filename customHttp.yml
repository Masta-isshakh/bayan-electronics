# Amplify Hosting custom headers for files served from public/ (next.config.ts headers()
# only reach responses rendered by Next; Amplify serves public/ itself, with max-age=5).
# Every URL below changes when its content does — /media/* is requested with ?v=<hash>,
# /_img/* variant names contain the hash, fonts are versioned by name — so a year is safe.
customHeaders:
  - pattern: "/_img/**"
    headers:
      - key: Cache-Control
        value: public, max-age=31536000, immutable
  - pattern: "/media/**"
    headers:
      - key: Cache-Control
        value: public, max-age=31536000, immutable
  - pattern: "/fonts/**"
    headers:
      - key: Cache-Control
        value: public, max-age=31536000, immutable
