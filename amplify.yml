version: 1
backend:
  phases:
    preBuild:
      commands:
        # Tailwind v4 (oxide) and sharp 0.35 require Node >= 20. Skip nvm's default global
        # packages (Amplify CLI, Cypress, Bower, …): unused here and ~1 min per build.
        - nvm install 22 --skip-default-packages
        - nvm use 22
    build:
      commands:
        - npm ci --cache .npm --prefer-offline
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
frontend:
  phases:
    preBuild:
      commands:
        - nvm use 22
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - "**/*"
  cache:
    paths:
      - .next/cache/**/*
      # Pre-built image variants: only new or changed photos are encoded on the next build.
      - public/_img/**/*
      - .npm/**/*
      - node_modules/**/*
